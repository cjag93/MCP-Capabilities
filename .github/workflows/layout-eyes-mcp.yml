name: Layout Eyes + MCP inspect/resolve

on:
  # Merge into main only. Pushing the PR branch or opening/updating a PR
  # must not start another run (that was the 2x-per-commit double fire).
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HEADLESS: "1"
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
      APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
      APPLITOOLS_BATCH_ID: ${{ github.sha }}
      APPLITOOLS_BATCH_NAME: Layout GHA — ${{ github.ref_name }} #${{ github.run_number }}
      APPLITOOLS_BATCH_BUILD_ID: ${{ github.run_id }}
      # Same beta flag as ~/.cursor/mcp.json — unlocks eyes_inspect_* and eyes_resolve_*.
      BETA_v0_5_16_2832: "true"
      EYES_RESOLVE_ACTION: accept
      EYES_RESOLVE_SAVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require secrets
        run: |
          missing=
          for name in CURSOR_API_KEY APPLITOOLS_API_KEY APPLITOOLS_READ_KEY APPLITOOLS_WRITE_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Add these repository secrets (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi

      - name: Install test dependencies
        run: npm ci

      - name: Install sample-app dependencies
        run: npm install --prefix sample-app

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run layout visual tests
        id: eyes-tests
        continue-on-error: true
        run: npm test

      - name: Cursor agent — Eyes inspect + resolve
        run: npm run ci:agent

      - name: Upload Eyes / Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
